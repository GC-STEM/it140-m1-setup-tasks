name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            **/*.md
            #codio/master/**

  local-links:
    name: Local links and assets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Check local Markdown links, anchors, and assets
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}"
            --offline
            --include-fragments=anchor-only
            --exclude-path "codio/master"
            --no-progress
            "./**/*.md"
          fail: true

  repository-configuration:
    name: Repository configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate required repository structure
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            "README.md"
            "github/README.md"
            "github/github_username.md"
            "codio/README.md"
            "local/README.md"
            "local/windows/README.md"
            "local/macOS/README.md"
            "local/linux/README.md"
            ".vscode/settings.json"
            ".github/ISSUE_TEMPLATE/report-a-problem.yml"
            ".github/ISSUE_TEMPLATE/request-an-improvement.yml"
          )

          for path in "${required_paths[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "::error file=$path::Required repository file is missing."
              exit 1
            fi
          done

          if [[ -e "codio/master" ]]; then
            echo "::error file=codio/master::Legacy codio/master content must not be restored."
            exit 1
          fi

      - name: Validate VS Code settings JSON
        run: python -m json.tool .vscode/settings.json > /dev/null

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --quiet PyYAML==6.0.2

      - name: Validate GitHub issue forms
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import yaml

          issue_forms = sorted(Path(".github/ISSUE_TEMPLATE").glob("*.yml"))
          if not issue_forms:
              print("::error::.github/ISSUE_TEMPLATE contains no .yml issue forms.")
              sys.exit(1)

          allowed_types = {"markdown", "input", "dropdown", "checkboxes", "textarea"}

          for path in issue_forms:
              try:
                  data = yaml.safe_load(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"::error file={path}::Invalid YAML: {exc}")
                  sys.exit(1)

              if not isinstance(data, dict):
                  print(f"::error file={path}::Issue form must be a YAML mapping.")
                  sys.exit(1)

              missing = [key for key in ("name", "description", "body") if key not in data]
              if missing:
                  print(
                      f"::error file={path}::Missing required top-level key(s): "
                      + ", ".join(missing)
                  )
                  sys.exit(1)

              if not isinstance(data["body"], list) or not data["body"]:
                  print(f"::error file={path}::The body must be a non-empty list.")
                  sys.exit(1)

              seen_ids = set()
              for index, element in enumerate(data["body"], start=1):
                  if not isinstance(element, dict):
                      print(
                          f"::error file={path}::Body element {index} must be a mapping."
                      )
                      sys.exit(1)

                  element_type = element.get("type")
                  if element_type not in allowed_types:
                      print(
                          f"::error file={path}::Body element {index} has unsupported "
                          f"type: {element_type!r}."
                      )
                      sys.exit(1)

                  if element_type != "markdown":
                      element_id = element.get("id")
                      if not isinstance(element_id, str) or not element_id.strip():
                          print(
                              f"::error file={path}::Body element {index} requires an id."
                          )
                          sys.exit(1)
                      if element_id in seen_ids:
                          print(
                              f"::error file={path}::Duplicate body element id: {element_id}."
                          )
                          sys.exit(1)
                      seen_ids.add(element_id)

          print(f"Validated {len(issue_forms)} GitHub issue form(s).")
          PY
